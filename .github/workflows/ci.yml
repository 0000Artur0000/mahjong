name: CI

on:
  push:
    branches: [main]
  pull_request:

# Новый пуш в ту же ветку отменяет предыдущий прогон.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Каждый компонент — отдельный job, чтобы в списке проверок было видно,
  # что именно упало, без чтения общего лога.
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      # check = spotless, компиляция с -Werror, unit, границы модулей Modulith
      # и интеграционные тесты на Testcontainers (Docker есть на ubuntu-latest).
      # Падает и при устаревшем gradle.lockfile — блокировка зависимостей включена.
      - run: ./gradlew --no-daemon :backend:check
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # check = lint, typecheck, vitest, contract-check против OpenAPI и сборка.
      # Типы API генерируются из contracts/openapi/api.yaml на pretest/prebuild,
      # поэтому расхождение контракта и клиента ломает сборку здесь же.
      - run: npm run check
        working-directory: frontend

  vision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Только stdlib-тесты: обучение и веса в CI не участвуют.
      - run: python -m unittest discover -s vision/tests
        env:
          PYTHONPATH: vision/src
      - run: python -m json.tool contracts/vision/vision-result.schema.json > /dev/null
