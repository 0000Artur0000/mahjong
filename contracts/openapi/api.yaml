openapi: 3.1.0
info:
  title: Dorahub Internal API
  version: 0.18.0
  description: |
    JSON uses lowerCamelCase property names and RFC 3339 UTC timestamps.
    Collection endpoints use zero-based pages and the shared page, size, sort and filter parameters.
servers:
  - url: /
paths:
  /api/v1/auth/csrf:
    get:
      operationId: getCsrfToken
      summary: Start or resume a browser session and return its CSRF token
      parameters:
        - $ref: "#/components/parameters/RequestCorrelationId"
        - $ref: "#/components/parameters/ClientSource"
      responses:
        "200":
          description: CSRF header name and token
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfTokenResponse"
  /api/v1/auth/email/code:
    post:
      operationId: requestEmailLoginCode
      summary: Request a one-time login code
      description: Always returns the same response for valid email input, including throttled requests.
      parameters:
        - $ref: "#/components/parameters/RequestCorrelationId"
        - $ref: "#/components/parameters/ClientSource"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailLoginCodeRequest"
      responses:
        "202":
          description: Request accepted without disclosing account existence
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/auth/email/verify:
    post:
      operationId: verifyEmailLoginCode
      summary: Verify a one-time code and create an authenticated session
      parameters:
        - $ref: "#/components/parameters/RequestCorrelationId"
        - $ref: "#/components/parameters/ClientSource"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailLoginCodeVerifyRequest"
      responses:
        "200":
          description: Authenticated account
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedAccountResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Invalidate the current session
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestCorrelationId"
        - $ref: "#/components/parameters/ClientSource"
      responses:
        "204":
          description: Session invalidated
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/auth/identities:
    get:
      operationId: listAccountIdentities
      summary: List login identities owned by the authenticated account
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestCorrelationId"
        - $ref: "#/components/parameters/ClientSource"
      responses:
        "200":
          description: Primary account and its login identities
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountIdentitiesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/identities/email:
    post:
      operationId: linkEmailIdentity
      summary: Link a verified email identity to the current primary account
      description: Requires a recent successful login. Accounts are never merged by this operation.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestCorrelationId"
        - $ref: "#/components/parameters/ClientSource"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailLoginCodeVerifyRequest"
      responses:
        "200":
          description: Identity linked, or already owned by the same primary account
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityLinkResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/auth/identities/{identityId}:
    delete:
      operationId: unlinkAccountIdentity
      summary: Unlink a login identity without removing the last working method
      description: Requires a recent successful login.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/IdentityId"
        - $ref: "#/components/parameters/RequestCorrelationId"
        - $ref: "#/components/parameters/ClientSource"
      responses:
        "204":
          description: Identity unlinked
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/auth/totp:
    get:
      operationId: getTotpStatus
      summary: Return TOTP state without returning its secret or recovery codes
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestCorrelationId"
        - $ref: "#/components/parameters/ClientSource"
      responses:
        "200":
          description: TOTP state and number of unused recovery codes
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: disableTotp
      summary: Disable TOTP and invalidate all recovery codes
      description: Requires a recent primary authentication and successful second factor.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestCorrelationId"
        - $ref: "#/components/parameters/ClientSource"
      responses:
        "204":
          description: TOTP disabled
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/auth/totp/enrollment:
    post:
      operationId: startTotpEnrollment
      summary: Create a pending encrypted TOTP secret
      description: Requires a recent primary authentication. A repeated pending enrollment replaces the old secret.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestCorrelationId"
        - $ref: "#/components/parameters/ClientSource"
      responses:
        "200":
          description: Provisioning URI shown only for this enrollment response
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpEnrollment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/auth/totp/enrollment/confirm:
    post:
      operationId: confirmTotpEnrollment
      summary: Confirm the first TOTP and issue one-time recovery codes
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestCorrelationId"
        - $ref: "#/components/parameters/ClientSource"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpCodeRequest"
      responses:
        "200":
          description: TOTP enabled; recovery codes are returned once and never retrievable again
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/auth/totp/verify:
    post:
      operationId: verifySecondFactor
      summary: Establish recent step-up using TOTP or one recovery code
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestCorrelationId"
        - $ref: "#/components/parameters/ClientSource"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecurityCodeRequest"
      responses:
        "200":
          description: Recent second-factor marker established in the current server session
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecondFactorVerification"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/auth/{provider}/start:
    get:
      operationId: startExternalLogin
      summary: Start Telegram or VK authorization with server-generated state and PKCE
      parameters:
        - $ref: "#/components/parameters/AuthProvider"
        - $ref: "#/components/parameters/RequestCorrelationId"
        - $ref: "#/components/parameters/ClientSource"
      responses:
        "302":
          description: Redirect to the selected provider
          headers:
            Location:
              description: Provider authorization URL
              schema:
                type: string
                format: uri
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
  /api/v1/auth/{provider}/link/start:
    get:
      operationId: startExternalIdentityLink
      summary: Start linking Telegram or VK to the current primary account
      description: Requires a recent successful login. Accounts are never merged by this operation.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/AuthProvider"
        - $ref: "#/components/parameters/RequestCorrelationId"
        - $ref: "#/components/parameters/ClientSource"
      responses:
        "302":
          description: Redirect to the selected provider with account-bound state and PKCE
          headers:
            Location:
              description: Provider authorization URL
              schema:
                type: string
                format: uri
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/auth/{provider}/callback:
    get:
      operationId: completeExternalLogin
      summary: Validate a provider login or identity-link callback
      description: |
        The callback must carry the same browser session established by the start endpoint.
        A link callback keeps the current primary account and rejects an identity owned by another account.
      parameters:
        - $ref: "#/components/parameters/AuthProvider"
        - $ref: "#/components/parameters/RequestCorrelationId"
        - name: state
          in: query
          required: true
          schema:
            type: string
            maxLength: 256
        - name: code
          in: query
          description: Required on a successful provider callback.
          schema:
            type: string
            maxLength: 2048
        - name: device_id
          in: query
          description: Required for VK ID callbacks.
          schema:
            type: string
            maxLength: 256
        - name: error
          in: query
          description: Provider cancellation or authorization error.
          schema:
            type: string
            maxLength: 128
      responses:
        "200":
          description: Authenticated account; callback state is consumed
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedAccountResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/profiles/{accountId}:
    get:
      operationId: getPublicProfile
      summary: Return the public fields of an active account
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - $ref: "#/components/parameters/RequestCorrelationId"
        - $ref: "#/components/parameters/ClientSource"
      responses:
        "200":
          description: Public profile without authentication or moderation data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProfile"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/account/profile:
    get:
      operationId: getOwnProfile
      summary: Return the authenticated account profile and privacy settings
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestCorrelationId"
        - $ref: "#/components/parameters/ClientSource"
      responses:
        "200":
          description: Own profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivateProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateOwnProfile
      summary: Replace editable profile fields and privacy settings
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestCorrelationId"
        - $ref: "#/components/parameters/ClientSource"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivateProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/account/deactivation:
    post:
      operationId: deactivateOwnAccount
      summary: Hide an account and invalidate its sessions
      description: Requires recent authentication and a second factor when enabled.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestCorrelationId"
        - $ref: "#/components/parameters/ClientSource"
      responses:
        "204":
          description: Account deactivated
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/account:
    delete:
      operationId: deleteOwnAccount
      summary: Deactivate an account and schedule personal-data cleanup
      description: Requires recent authentication and a second factor when enabled.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestCorrelationId"
        - $ref: "#/components/parameters/ClientSource"
      responses:
        "202":
          description: Cleanup was scheduled and all sessions were invalidated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDeletion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/system/time:
    get:
      operationId: getServerTime
      summary: Return authoritative server time
      parameters:
        - $ref: "#/components/parameters/RequestCorrelationId"
        - $ref: "#/components/parameters/ClientSource"
      responses:
        "200":
          description: Current UTC server time
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerTimeResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/tables:
    get:
      operationId: listMyTables
      summary: Tables the authenticated player sits at, most recent first
      security:
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - $ref: "#/components/parameters/RequestCorrelationId"
        - $ref: "#/components/parameters/ClientSource"
      responses:
        "200":
          description: Tables of the player
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TableSummaryView"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createTable
      summary: Create a table in lobby state with an immutable ruleset snapshot
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestCorrelationId"
        - $ref: "#/components/parameters/ClientSource"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTableRequest"
      responses:
        "201":
          description: Created table
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/tables/stats:
    get:
      operationId: getTableStats
      summary: Pilot metrics over tables; moderator only, no personal data
      parameters:
        - $ref: "#/components/parameters/RequestCorrelationId"
        - $ref: "#/components/parameters/ClientSource"
      responses:
        "200":
          description: Counts and durations over all tables
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableStatsView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/tables/hands/mine:
    get:
      operationId: getMyHands
      summary: Own won hands, newest first; reverted ones are left out
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - $ref: "#/components/parameters/RequestCorrelationId"
        - $ref: "#/components/parameters/ClientSource"
      responses:
        "200":
          description: Won hands of the signed-in player
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WonHandView"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/tables/{tableId}:
    get:
      operationId: getTable
      summary: Return the current table state and aggregate version
      parameters:
        - $ref: "#/components/parameters/TableId"
        - $ref: "#/components/parameters/RequestCorrelationId"
        - $ref: "#/components/parameters/ClientSource"
      responses:
        "200":
          description: Table state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableView"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/tables/{tableId}/events:
    get:
      operationId: getTableEvents
      summary: Poll the append-only table journal after a known sequence
      parameters:
        - $ref: "#/components/parameters/TableId"
        - $ref: "#/components/parameters/EventsSince"
        - $ref: "#/components/parameters/RequestCorrelationId"
        - $ref: "#/components/parameters/ClientSource"
      responses:
        "200":
          description: Events ordered by sequence
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TableEventView"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/tables/{tableId}/players:
    post:
      operationId: joinTable
      summary: Join the lobby as the authenticated account
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/TableId"
        - $ref: "#/components/parameters/RequestCorrelationId"
        - $ref: "#/components/parameters/ClientSource"
      responses:
        "200":
          description: Table state after joining
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/tables/{tableId}/players/me:
    delete:
      operationId: leaveLobby
      summary: Leave a lobby before the game starts
      parameters:
        - $ref: "#/components/parameters/TableId"
        - $ref: "#/components/parameters/RequestCorrelationId"
        - $ref: "#/components/parameters/ClientSource"
      responses:
        "200":
          description: Table state without the player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/tables/{tableId}/start:
    post:
      operationId: startTable
      summary: Seat the four participants and start the game
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/TableId"
        - $ref: "#/components/parameters/RequestCorrelationId"
        - $ref: "#/components/parameters/ClientSource"
      responses:
        "200":
          description: Active table
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/tables/{tableId}/riichi:
    post:
      operationId: declareRiichi
      summary: Move a 1000 point stick from a seat onto the table
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/TableId"
        - $ref: "#/components/parameters/RequestCorrelationId"
        - $ref: "#/components/parameters/ClientSource"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RiichiRequest"
      responses:
        "200":
          description: Table state after the declaration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/tables/{tableId}/hands/preview:
    post:
      operationId: previewHand
      summary: Score a hand without changing the table
      parameters:
        - $ref: "#/components/parameters/TableId"
        - $ref: "#/components/parameters/RequestCorrelationId"
        - $ref: "#/components/parameters/ClientSource"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HandRequest"
      responses:
        "200":
          description: Score breakdown and payments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandPaymentView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/tables/{tableId}/hands:
    post:
      operationId: confirmHand
      summary: Apply a won hand; requires the aggregate version the preview was built on
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/TableId"
        - $ref: "#/components/parameters/RequestCorrelationId"
        - $ref: "#/components/parameters/ClientSource"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HandRequest"
      responses:
        "200":
          description: Applied payments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandPaymentView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/tables/{tableId}/draws:
    post:
      operationId: recordDraw
      summary: Record an exhaustive or abortive draw
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/TableId"
        - $ref: "#/components/parameters/RequestCorrelationId"
        - $ref: "#/components/parameters/ClientSource"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DrawRequest"
      responses:
        "200":
          description: Table state after the draw
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/tables/{tableId}/seats/{seat}/player:
    post:
      operationId: takeSeat
      summary: Take a seat left free mid-game; the game stops counting towards rating
      parameters:
        - $ref: "#/components/parameters/TableId"
        - $ref: "#/components/parameters/Seat"
        - $ref: "#/components/parameters/RequestCorrelationId"
        - $ref: "#/components/parameters/ClientSource"
      responses:
        "200":
          description: Table state with the seat taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: leaveSeat
      summary: Leave the table mid-game; scores stay and the seat waits for a substitute
      parameters:
        - $ref: "#/components/parameters/TableId"
        - $ref: "#/components/parameters/Seat"
        - $ref: "#/components/parameters/RequestCorrelationId"
        - $ref: "#/components/parameters/ClientSource"
      responses:
        "200":
          description: Table state with the seat free
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/tables/{tableId}/revert:
    post:
      operationId: revertTable
      summary: Return an active table to a version it previously had (moderator only)
      parameters:
        - $ref: "#/components/parameters/TableId"
        - $ref: "#/components/parameters/RequestCorrelationId"
        - $ref: "#/components/parameters/ClientSource"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevertRequest"
      responses:
        "200":
          description: Table state after the revert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/tables/{tableId}/finish:
    post:
      operationId: finishTable
      summary: Finish the table early and publish final standings
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/TableId"
        - $ref: "#/components/parameters/RequestCorrelationId"
        - $ref: "#/components/parameters/ClientSource"
      responses:
        "200":
          description: Finished table with standings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/ratings:
    get:
      operationId: getLadder
      summary: Ladder of one format, strongest first
      parameters:
        - name: format
          in: query
          required: true
          description: Ladder key, for example "hanchan". Formats are rated separately.
          schema: { type: string, minLength: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - $ref: "#/components/parameters/RequestCorrelationId"
        - $ref: "#/components/parameters/ClientSource"
      responses:
        "200":
          description: Ladder rows ordered by rating
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LadderEntryView"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/ratings/me/summary:
    get:
      operationId: getMyRatingSummary
      summary: Own games, places and rating per format
      parameters:
        - $ref: "#/components/parameters/RequestCorrelationId"
        - $ref: "#/components/parameters/ClientSource"
      responses:
        "200":
          description: One row per format the player has finished games in
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FormatSummaryView"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/ratings/me:
    get:
      operationId: getMyRatingChanges
      summary: Own rating changes, newest first
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - $ref: "#/components/parameters/RequestCorrelationId"
        - $ref: "#/components/parameters/ClientSource"
      responses:
        "200":
          description: Rating changes of the signed-in player
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RatingChangeView"
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: DORAHUB_SESSION
  headers:
    CorrelationId:
      description: Request correlation identifier. The server returns a safe supplied value or generates one.
      schema:
        type: string
        pattern: "^[A-Za-z0-9._-]{1,64}$"
  parameters:
    TableId:
      name: tableId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Seat:
      name: seat
      in: path
      required: true
      schema: { type: integer, minimum: 0, maximum: 3 }
    EventsSince:
      name: since
      in: query
      description: Return events with a sequence strictly greater than this value.
      schema:
        type: integer
        format: int64
        minimum: 0
        default: 0
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AuthProvider:
      name: provider
      in: path
      required: true
      schema:
        type: string
        enum: [telegram, vk]
    IdentityId:
      name: identityId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RequestCorrelationId:
      name: X-Correlation-Id
      in: header
      description: Optional caller-generated request correlation identifier.
      schema:
        type: string
        pattern: "^[A-Za-z0-9._-]{1,64}$"
    ClientSource:
      name: X-Client-Source
      in: header
      description: Low-cardinality client channel, without device or user identifiers.
      schema:
        type: string
        pattern: "^[A-Za-z0-9._-]{1,32}$"
    Page:
      name: page
      in: query
      description: Zero-based page number.
      schema:
        type: integer
        minimum: 0
        maximum: 10000
        default: 0
    Size:
      name: size
      in: query
      description: Number of items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Sort:
      name: sort
      in: query
      description: Repeatable `field,direction` value. Direction is `asc` or `desc`.
      style: form
      explode: true
      schema:
        type: array
        maxItems: 5
        items:
          type: string
          pattern: "^[A-Za-z][A-Za-z0-9.]*,(asc|desc)$"
    Filter:
      name: filter
      in: query
      description: Endpoint-supported field/value filters encoded as a deep object.
      style: deepObject
      explode: true
      schema:
        type: object
        maxProperties: 20
        additionalProperties:
          type: string
          maxLength: 200
  responses:
    BadRequest:
      $ref: "#/components/responses/ProblemResponse"
      description: Malformed request (`request.invalid`).
    Unauthorized:
      $ref: "#/components/responses/ProblemResponse"
      description: Authentication is required (`authentication.required`).
    Forbidden:
      $ref: "#/components/responses/ProblemResponse"
      description: Access is denied (`access.denied`).
    NotFound:
      $ref: "#/components/responses/ProblemResponse"
      description: Resource was not found (`resource.not_found`).
    Conflict:
      $ref: "#/components/responses/ProblemResponse"
      description: Request conflicts with current state (`state.conflict`).
    PayloadTooLarge:
      $ref: "#/components/responses/ProblemResponse"
      description: Request body is too large (`request.too_large`).
    UnprocessableEntity:
      $ref: "#/components/responses/ProblemResponse"
      description: Request is syntactically valid but cannot be processed (`request.unprocessable`).
    TooManyRequests:
      $ref: "#/components/responses/ProblemResponse"
      description: Rate limit was exceeded (`rate_limit.exceeded`).
    ServiceUnavailable:
      $ref: "#/components/responses/ProblemResponse"
      description: A required service is unavailable (`service.unavailable`).
    ProblemResponse:
      description: Request failed.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    CreateTableRequest:
      type: object
      required: [rulesetKey, format]
      properties:
        rulesetKey: { type: string, minLength: 1 }
        format:
          type: string
          enum: [HANCHAN, TONPUUSEN]
    RiichiRequest:
      type: object
      required: [seat]
      properties:
        seat: { type: integer, minimum: 0, maximum: 3 }
    DrawRequest:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [EXHAUSTIVE, ABORTIVE]
        tenpaiSeats:
          type: array
          description: Seats that declared tenpai. Ignored for abortive draws.
          items: { type: integer, minimum: 0, maximum: 3 }
    DoraCount:
      type: object
      description: >
        Готовые счётчики доры. Оставлены для совместимости; предпочтительно присылать
        `doraIndicators`/`uraIndicators` и позволить серверу посчитать самому.
        Если заданы индикаторы, эти счётчики игнорируются.
      properties:
        ordinary: { type: integer, minimum: 0, default: 0 }
        ura: { type: integer, minimum: 0, default: 0 }
        kan: { type: integer, minimum: 0, default: 0 }
        aka: { type: integer, minimum: 0, default: 0 }
    HandRequest:
      type: object
      required: [tiles, winningTile, winnerSeat]
      properties:
        tiles:
          type: array
          minItems: 1
          description: Concealed part of the hand in mjai notation, winning tile included.
          items: { type: string, minLength: 2 }
        melds:
          type: array
          description: Called sets, for example "333p" for a pon or "1111s" for a kan.
          items: { type: string, minLength: 3 }
        winningTile: { type: string, minLength: 2 }
        tsumo: { type: boolean, default: false }
        winnerSeat: { type: integer, minimum: 0, maximum: 3 }
        discarderSeat:
          type: integer
          minimum: 0
          maximum: 3
          description: Required for ron, omitted for tsumo.
        doraIndicators:
          type: array
          description: >
            Тайлы-индикаторы: первый базовый, остальные открыты канами. Сервер сам
            выводит дору по циклу §11 и считает её в руке — предпочтительный путь.
            Красные пятёрки в `dora` указывать не нужно: они уже в составе руки.
          maxItems: 5
          items: { type: string, minLength: 2 }
        uraIndicators:
          type: array
          description: >
            Нижние индикаторы, по одному на каждый верхний. Доступны только
            победителю с объявленным риичи.
          maxItems: 5
          items: { type: string, minLength: 2 }
        dora:
          $ref: "#/components/schemas/DoraCount"
        declaredYaku:
          type: array
          description: Yaku a photo cannot prove, declared by the player.
          items:
            type: string
            enum: [Richi, WRichi, Ippatsu, Rinshan, Chankan, Haitei, Houtei, Tenhou, Chihou]
        expectedVersion:
          type: integer
          format: int64
          description: Aggregate version the preview was built on. Required to confirm.
    HandPaymentView:
      type: object
      required: [han, fu, yaku, dora, yakumanCount, seatDelta, riichiSticksAwarded]
      properties:
        han: { type: integer }
        fu: { type: integer }
        yaku:
          type: array
          items: { type: string }
        dora:
          $ref: "#/components/schemas/DoraCount"
        yakumanCount: { type: integer, minimum: 0 }
        seatDelta:
          type: array
          description: Point change per seat. Always sums to zero.
          minItems: 4
          maxItems: 4
          items: { type: integer }
        riichiSticksAwarded: { type: integer, minimum: 0 }
    TableSummaryView:
      type: object
      required: [id, state, format, handsPlayed, updatedAt]
      properties:
        id: { type: string, format: uuid }
        state:
          type: string
          enum: [lobby, active, finished]
        format:
          type: string
          enum: [hanchan, tonpuusen]
        handsPlayed: { type: integer, minimum: 0 }
        updatedAt: { type: string, format: date-time }
    PlacementView:
      type: object
      required: [seat, place, points, uma, result]
      properties:
        seat: { type: integer, minimum: 0, maximum: 3 }
        place: { type: integer, minimum: 1, maximum: 4 }
        points: { type: integer }
        uma: { type: integer }
        result: { type: integer }
    TableView:
      type: object
      required:
        [id, state, format, rulesetId, participants, seats, scores, dealerSeat, roundWind,
         handNumber, honba, riichiSticks, handsPlayed, vacantSeats, version, nicknames,
         updatedAt]
      properties:
        id: { type: string, format: uuid }
        state:
          type: string
          enum: [lobby, active, finished]
        format:
          type: string
          enum: [hanchan, tonpuusen]
        rulesetId:
          type: string
          description: Ruleset key and version, for example "rrc-ru@1.0".
        participants:
          type: array
          items: { type: string, format: uuid }
        seats:
          type: array
          description: Players by seat once the game started; empty in lobby.
          items: { type: string, format: uuid }
        scores:
          type: array
          items: { type: integer }
        dealerSeat: { type: integer, minimum: 0, maximum: 3 }
        roundWind:
          type: string
          enum: [east, south, west, north]
        handNumber: { type: integer, minimum: 1, maximum: 4 }
        honba: { type: integer, minimum: 0 }
        riichiSticks: { type: integer, minimum: 0 }
        handsPlayed: { type: integer, minimum: 0 }
        vacantSeats:
          type: array
          description: >-
            Seats whose player left mid-game. Hands cannot be recorded until every seat is
            taken again.
          items: { type: integer, minimum: 0, maximum: 3 }
        version:
          type: integer
          format: int64
          description: Aggregate version; also the sequence of the last journal event.
        nicknames:
          type: object
          additionalProperties: { type: string }
          description: >-
            Nicknames of the participants by account id. A seat wind alone says nothing —
            players need to see who sits where.
        updatedAt:
          type: string
          format: date-time
          description: >-
            Last change of the table. A game with no new hands for a long time is shown as
            stale by the client; the server never closes a game on its own, only empty lobbies.
        finishedReason:
          type: string
          enum: [completed, early, abandoned_lobby]
          description: >-
            Why the table is finished; absent while the game is on. Only "completed" counts
            towards rating.
        standings:
          type: array
          description: Final places with uma; present only for a finished game.
          items:
            $ref: "#/components/schemas/PlacementView"
    LadderEntryView:
      type: object
      required: [accountId, rating, games]
      properties:
        accountId: { type: string, format: uuid }
        nickname:
          type: [string, "null"]
          description: Absent for an account that no longer exists.
        rating: { type: integer }
        games: { type: integer, minimum: 1 }
    FormatSummaryView:
      type: object
      required: [format, rating, games, places, averagePlace]
      properties:
        format: { type: string }
        rating: { type: integer }
        games:
          type: integer
          minimum: 1
          description: Games that still count; a game taken off the ladder is not among them.
        places:
          type: array
          description: How many times the player finished first, second, third and fourth.
          items: { type: integer, minimum: 0 }
          minItems: 4
          maxItems: 4
        averagePlace: { type: number }
    TableStatsView:
      type: object
      required:
        [lobbies, active, stale, completed, abandonedEarly, abandonedLobby, completionRate,
         handsPerCompletedGame, medianMinutes, p90Minutes]
      properties:
        lobbies: { type: integer, minimum: 0 }
        active: { type: integer, minimum: 0 }
        stale:
          type: integer
          minimum: 0
          description: Active games with no new hand for over 12 hours.
        completed: { type: integer, minimum: 0 }
        abandonedEarly: { type: integer, minimum: 0 }
        abandonedLobby: { type: integer, minimum: 0 }
        completionRate:
          type: number
          description: Percentage of finished tables that were played to the end of the format.
        handsPerCompletedGame: { type: number }
        medianMinutes: { type: integer, format: int64 }
        p90Minutes: { type: integer, format: int64 }
    WonHandView:
      type: object
      required: [tableId, sequence, han, fu, yaku, at]
      properties:
        tableId: { type: string, format: uuid }
        sequence: { type: integer, format: int64, minimum: 1 }
        han: { type: integer, minimum: 0 }
        fu: { type: integer, minimum: 0 }
        yaku:
          type: array
          items: { type: string }
        at: { type: string, format: date-time }
    RatingChangeView:
      type: object
      required: [tableId, format, place, delta, ratingAfter, at]
      properties:
        tableId: { type: string, format: uuid }
        format: { type: string }
        place: { type: integer, minimum: 1, maximum: 4 }
        delta:
          type: integer
          description: Change of rating for this game. Deltas of one game sum to zero.
        ratingAfter: { type: integer }
        at: { type: string, format: date-time }
    RevertRequest:
      type: object
      required: [toVersion, reason]
      properties:
        toVersion:
          type: integer
          format: int64
          minimum: 0
          description: Aggregate version to return to. Must be one the table published.
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Goes to the journal; a revert without a reason is indistinguishable from abuse.
    TableEventView:
      type: object
      required: [sequence, type, payload]
      properties:
        sequence: { type: integer, format: int64, minimum: 1 }
        type: { type: string }
        payload:
          type: object
          additionalProperties: true
    CsrfTokenResponse:
      type: object
      additionalProperties: false
      required: [headerName, token]
      properties:
        headerName:
          type: string
          const: X-CSRF-TOKEN
        token:
          type: string
          minLength: 1
    EmailLoginCodeRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
    EmailLoginCodeVerifyRequest:
      type: object
      additionalProperties: false
      required: [email, code]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        code:
          type: string
          pattern: "^[0-9]{6}$"
    AuthenticatedAccountResponse:
      type: object
      additionalProperties: false
      required: [accountId]
      properties:
        accountId:
          type: string
          format: uuid
    PublicProfile:
      type: object
      additionalProperties: false
      required: [accountId, nickname]
      properties:
        accountId:
          type: string
          format: uuid
        nickname:
          type: string
          minLength: 3
          maxLength: 32
        city:
          type: [string, "null"]
          maxLength: 128
    ProfilePrivacy:
      type: object
      additionalProperties: false
      required: [showCity, showClubs]
      properties:
        showCity:
          type: boolean
        showClubs:
          type: boolean
    PrivateProfile:
      type: object
      additionalProperties: false
      required: [accountId, nickname, status, role, privacy]
      properties:
        accountId:
          type: string
          format: uuid
        nickname:
          type: string
          minLength: 3
          maxLength: 32
        city:
          type: [string, "null"]
          maxLength: 128
        avatarMediaId:
          type: [string, "null"]
          format: uuid
        status:
          type: string
          enum: [active, deactivated]
        role:
          type: string
          enum: [player, moderator, admin]
          description: >-
            Rights of the account. Only a moderator can revert a confirmed hand; the screen
            needs this to decide whether to offer it.
        privacy:
          $ref: "#/components/schemas/ProfilePrivacy"
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      required: [nickname, privacy]
      properties:
        nickname:
          type: string
          minLength: 3
          maxLength: 32
          pattern: "^[\\p{L}\\p{N}_-]+$"
        city:
          type: [string, "null"]
          maxLength: 128
        avatarMediaId:
          type: [string, "null"]
          format: uuid
        privacy:
          $ref: "#/components/schemas/ProfilePrivacy"
    AccountDeletion:
      type: object
      additionalProperties: false
      required: [jobId, status]
      properties:
        jobId:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, running, completed, failed]
    AccountIdentity:
      type: object
      additionalProperties: false
      required: [id, provider, subject, createdAt]
      properties:
        id:
          type: string
          format: uuid
        provider:
          type: string
          enum: [email, telegram, vk]
        subject:
          type: string
          maxLength: 320
        createdAt:
          type: string
          format: date-time
    AccountIdentitiesResponse:
      type: object
      additionalProperties: false
      required: [primaryAccountId, identities]
      properties:
        primaryAccountId:
          type: string
          format: uuid
        identities:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/AccountIdentity"
    IdentityLinkResponse:
      type: object
      additionalProperties: false
      required: [primaryAccountId, accountMerged, created, identity]
      properties:
        primaryAccountId:
          type: string
          format: uuid
        accountMerged:
          type: boolean
          const: false
        created:
          type: boolean
        identity:
          $ref: "#/components/schemas/AccountIdentity"
    TotpStatus:
      type: object
      additionalProperties: false
      required: [state, recoveryCodesRemaining]
      properties:
        state:
          type: string
          enum: [disabled, pending, enabled]
        recoveryCodesRemaining:
          type: integer
          minimum: 0
          maximum: 10
    TotpEnrollment:
      type: object
      additionalProperties: false
      required: [provisioningUri]
      properties:
        provisioningUri:
          type: string
          pattern: "^otpauth://totp/"
          maxLength: 512
    TotpCodeRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          pattern: "^[0-9]{6}$"
    SecurityCodeRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          pattern: "^([0-9]{6}|[A-Za-z0-9_-]{22})$"
    RecoveryCodesResponse:
      type: object
      additionalProperties: false
      required: [recoveryCodes]
      properties:
        recoveryCodes:
          type: array
          minItems: 10
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            pattern: "^[A-Za-z0-9_-]{22}$"
    SecondFactorVerification:
      type: object
      additionalProperties: false
      required: [factor]
      properties:
        factor:
          type: string
          enum: [totp, recovery]
    ServerTimeResponse:
      type: object
      additionalProperties: false
      required: [serverTime]
      properties:
        serverTime:
          type: string
          format: date-time
    PageMetadata:
      type: object
      additionalProperties: false
      required: [page, size, totalElements, totalPages]
      properties:
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 100 }
        totalElements: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    FieldError:
      type: object
      additionalProperties: false
      required: [field, code, message]
      properties:
        field: { type: string }
        code: { type: string }
        message: { type: string }
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status, code, correlationId]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        code: { type: string, pattern: "^[a-z][a-z0-9_]*(\\.[a-z][a-z0-9_]*)+$" }
        correlationId:
          type: string
          pattern: "^[A-Za-z0-9._-]{1,64}$"
        fieldErrors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
